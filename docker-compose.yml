services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - app_data:/app/data
      - app_banners:/app/public/banners
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Portainer CE - Docker management UI.
  # Accessible at https://VPS_IP:9443 (Portainer built-in HTTPS, self-signed cert).
  # SECURITY: restrict port 9443 on your VPS firewall to trusted IPs only.
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9443:9443"
    volumes:
      # Docker socket access - required for Portainer to manage containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # Uptime Kuma - self-hosted monitoring & status page.
  # Accessible at http://VPS_IP:3001 (set up login on first visit).
  # SECURITY: restrict port 3001 on your VPS firewall to trusted IPs only.
  # Docker socket mount enables the "Docker Container" monitor type.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3001"
    volumes:
      # Docker socket access - required for Docker container status monitors.
      - /var/run/docker.sock:/var/run/docker.sock
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  app_data:
  app_banners:
  caddy_data:
  caddy_config:
  portainer_data:
  uptime_kuma_data:
